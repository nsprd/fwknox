[package]
name = "fwknox-daemon"
description = "fwknox daemon library and binary"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lints.rust]
# privsep_run.rs requires unsafe { fork() }; override the workspace forbid.
unsafe_code = "allow"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
duration_suboptimal_units = "allow"

[dependencies]
caps.workspace = true
clap.workspace = true
fwknox-capture.workspace = true
fwknox-config.workspace = true
fwknox-firewall.workspace = true
fwknox-privsep.workspace = true
fwknox-proto.workspace = true
nix.workspace = true
fwknox-replay.workspace = true
fwknox-sandbox.workspace = true
signal-hook.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
base64.workspace = true
tempfile.workspace = true

[[bin]]
name = "fwknoxd"
path = "src/bin/fwknoxd.rs"

[[bin]]
name = "fwknoxd-mock"
path = "src/bin/fwknoxd-mock.rs"
