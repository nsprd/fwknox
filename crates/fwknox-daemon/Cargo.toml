[package]
name = "fwknox-daemon"
description = "fwknox daemon library and binary"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lints.rust]
# privsep_run.rs requires unsafe { fork() }; override the workspace forbid.
unsafe_code = "allow"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
duration_suboptimal_units = "allow"

[dependencies]
caps.workspace = true
clap.workspace = true
fwknox-capture.workspace = true
fwknox-config.workspace = true
fwknox-firewall.workspace = true
fwknox-privsep.workspace = true
fwknox-proto.workspace = true
fwknox-ratelimit.workspace = true
nix.workspace = true
fwknox-replay.workspace = true
fwknox-sandbox.workspace = true
signal-hook.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
base64.workspace = true
clap.workspace = true
fwknox-client.workspace = true
libc.workspace = true
tempfile.workspace = true

[[bin]]
name = "fwknoxd"
path = "src/bin/fwknoxd.rs"

[[bin]]
name = "fwknoxd-mock"
path = "src/bin/fwknoxd-mock.rs"

# --- Distro packaging ---------------------------------------------------------
#
# The .deb and .rpm below bundle BOTH binaries (fwknox + fwknoxd), the
# example config as the real /etc/fwknox/fwknoxd.toml, the systemd unit,
# and the license. They are built in release CI via:
#
#   cargo deb           -p fwknox-daemon --target <target> --no-build --no-strip
#   cargo generate-rpm  -p fwknox-daemon --target <target>
#
# `fwknox` is a binary from the sibling `fwknox-client` crate; cargo-deb
# and cargo-generate-rpm both accept it as a cross-crate asset because the
# binary is produced by the same workspace `cargo build --workspace --bins`
# that precedes the packaging step. Paths that start with `target/release/`
# are auto-remapped by cargo-deb when `--target` is passed.

[package.metadata.deb]
name = "fwknox"
maintainer = "fwknox maintainers <noreply@fwknox.invalid>"
copyright = "2026, fwknox maintainers"
license-file = ["../../LICENSE", "0"]
extended-description = """
fwknox is a Single Packet Authorization (SPA) firewall daemon — a
clean-room Rust port of fwknop. It keeps protected services invisible
to port scanners and opens them only to clients that can prove knowledge
of a shared secret via one authenticated, encrypted UDP packet.
"""
depends = "libc6, nftables"
section = "net"
priority = "optional"
assets = [
    ["target/release/fwknoxd", "/usr/bin/fwknoxd", "755"],
    ["target/release/fwknox",  "/usr/bin/fwknox",  "755"],
    ["../../config/fwknoxd.toml.example", "/etc/fwknox/fwknoxd.toml.example", "644"],
    ["../../LICENSE",                     "/usr/share/doc/fwknox/LICENSE", "644"],
    ["../../README.md",                   "/usr/share/doc/fwknox/README.md", "644"],
]
conf-files = [
    "/etc/fwknox/fwknoxd.toml.example",
]

# cargo-deb auto-installs `<unit-scripts>/<unit-name>.service` at
# /usr/lib/systemd/system/ — do not duplicate it in `assets` above.
# `enable = false` / `start = false` are deliberate: a port-facing
# daemon should not auto-start on package install before the operator
# has written a config. After install, the operator runs:
#   sudo systemctl daemon-reload
#   sudo systemctl enable --now fwknoxd
# (cargo-deb skips postinst generation entirely when both enable and
# start are false, so the daemon-reload is on the operator.)
[package.metadata.deb.systemd-units]
unit-name = "fwknoxd"
unit-scripts = "../../dist"
enable = false
start = false

[package.metadata.generate-rpm]
name = "fwknox"
summary = "Single Packet Authorization firewall daemon — Rust port of fwknop"
license = "AGPL-3.0-or-later"
requires = { nftables = "*" }
assets = [
    { source = "target/release/fwknoxd", dest = "/usr/bin/fwknoxd", mode = "755" },
    { source = "target/release/fwknox",  dest = "/usr/bin/fwknox",  mode = "755" },
    { source = "config/fwknoxd.toml.example", dest = "/etc/fwknox/fwknoxd.toml.example", mode = "644", config = true },
    { source = "dist/fwknoxd.service",        dest = "/usr/lib/systemd/system/fwknoxd.service", mode = "644" },
    { source = "LICENSE",                     dest = "/usr/share/licenses/fwknox/LICENSE", mode = "644", doc = true },
    { source = "README.md",                   dest = "/usr/share/doc/fwknox/README.md", mode = "644", doc = true },
]
