# SPDX-License-Identifier: AGPL-3.0-or-later

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-toolchain.toml channel
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/ {print $2}' rust-toolchain.toml)
          if [ -z "$channel" ]; then echo "channel not found" && exit 1; fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-toolchain.toml channel
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/ {print $2}' rust-toolchain.toml)
          if [ -z "$channel" ]; then echo "channel not found" && exit 1; fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-toolchain.toml channel
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/ {print $2}' rust-toolchain.toml)
          if [ -z "$channel" ]; then echo "channel not found" && exit 1; fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace --all-targets

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-toolchain.toml channel
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/ {print $2}' rust-toolchain.toml)
          if [ -z "$channel" ]; then echo "channel not found" && exit 1; fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: audit
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Audit dependencies
        # Default mode: fail only on vulnerabilities. We intentionally
        # do NOT pass --deny warnings because that promotes yanked /
        # unmaintained notices to errors, and those aren't security
        # issues we can fix without a dep bump from upstream.
        run: cargo audit

  build:
    name: release build
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-toolchain.toml channel
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/ {print $2}' rust-toolchain.toml)
          if [ -z "$channel" ]; then echo "channel not found" && exit 1; fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
      - name: Release build
        run: cargo build --release --workspace --bins
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: fwknox-binaries-${{ github.sha }}
          path: |
            target/release/fwknox
            target/release/fwknoxd
          retention-days: 7

  aarch64-check:
    name: aarch64 check
    runs-on: ubuntu-latest
    env:
      # `ring` and other C-FFI crates invoke a C compiler during their
      # build scripts even for `cargo check`. Point them at the cross
      # gcc we install below.
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4
      - name: Install aarch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Read rust-toolchain.toml channel
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/ {print $2}' rust-toolchain.toml)
          if [ -z "$channel" ]; then echo "channel not found" && exit 1; fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Install pinned toolchain with aarch64 target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64
      - name: Cross type-check
        # `cargo check` is sufficient — we don't need to link a binary,
        # we just need to prove the source compiles for aarch64. The
        # sandbox crate's seccomp allow-list is the thing we care about.
        run: cargo check --workspace --target aarch64-unknown-linux-gnu
