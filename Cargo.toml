[workspace]
resolver = "2"
members = [
    "crates/fwknox-proto",
    "crates/fwknox-config",
    "crates/fwknox-replay",
    "crates/fwknox-firewall",
    "crates/fwknox-capture",
    "crates/fwknox-sandbox",
    "crates/fwknox-client",
    "crates/fwknox-daemon",
    "tests/integration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = []
repository = "https://github.com/nsprd/fwknox"
homepage = "https://github.com/nsprd/fwknox"
readme = "README.md"

[workspace.dependencies]
ring         = "0.17"
rmp-serde    = "1"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
thiserror    = "2"
base64       = "0.22"
zeroize      = { version = "1", features = ["zeroize_derive"] }
toml         = "0.8"
ipnet        = { version = "2", features = ["serde"] }
humantime-serde = "1"
hex          = "0.4"
tempfile     = "3"
fwknox-proto  = { path = "crates/fwknox-proto" }
fwknox-config = { path = "crates/fwknox-config" }
fwknox-replay   = { path = "crates/fwknox-replay" }
fwknox-firewall = { path = "crates/fwknox-firewall" }
fwknox-capture  = { path = "crates/fwknox-capture" }
tracing         = "0.1"
nftables        = "0.6"
clap                = { version = "4", features = ["derive"] }
signal-hook         = "0.3"
tracing-subscriber  = { version = "0.3", features = ["env-filter"] }
fwknox-client       = { path = "crates/fwknox-client" }
fwknox-daemon       = { path = "crates/fwknox-daemon" }
caps                = "0.5"
nix                 = { version = "0.29", features = ["user"] }
landlock            = "0.4"
sd-notify           = "0.4"
fwknox-sandbox      = { path = "crates/fwknox-sandbox" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
duration_suboptimal_units = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
