# SPDX-License-Identifier: AGPL-3.0-or-later

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Read rust-toolchain.toml channel
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/ {print $2}' rust-toolchain.toml)
          if [ -z "$channel" ]; then echo "channel not found" && exit 1; fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - name: Build release binaries
        run: cargo build --release --workspace --bins --target ${{ matrix.target }}

      - name: Stage and archive
        run: |
          mkdir -p dist-out
          cp target/${{ matrix.target }}/release/fwknox  dist-out/fwknox
          cp target/${{ matrix.target }}/release/fwknoxd dist-out/fwknoxd
          cp config/fwknoxd.toml.example dist-out/fwknoxd.toml.example
          cp dist/fwknoxd.service dist-out/fwknoxd.service
          cp LICENSE dist-out/LICENSE
          tar czf fwknox-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C dist-out .

      # Keep binaries at their original target-qualified path so cargo-deb
      # and cargo-generate-rpm (both respect --target) can find them in
      # the packaging jobs.
      - uses: actions/upload-artifact@v4
        with:
          name: release-build-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/fwknox
            target/${{ matrix.target }}/release/fwknoxd
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.arch }}
          path: fwknox-*.tar.gz
          retention-days: 1

  docker:
    name: build and push image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push per-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          cache-from: type=gha,scope=docker-release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-release-${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    name: assemble multi-arch manifest
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: release-digest-*
          merge-multiple: true

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action strips the leading "v" so v0.1.0 -> 0.1.0 and
      # emits major.minor + major rolling tags. :latest is only applied
      # on the default branch to avoid demoting a newer release if an
      # older-branch hotfix tag is pushed.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create and push manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          refs=""
          for f in /tmp/digests/*; do
            digest=$(cat "$f")
            refs="$refs ${IMAGE}@${digest}"
          done
          for tag in $(jq -r '.tags[]' <<<"$DOCKER_METADATA_OUTPUT_JSON"); do
            docker buildx imagetools create --tag "$tag" $refs
          done

  deb:
    name: package .deb (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Read rust-toolchain.toml channel
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/ {print $2}' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.target }}

      - uses: actions/download-artifact@v4
        with:
          name: release-build-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release

      - name: Restore binary permissions
        run: |
          chmod 0755 \
            target/${{ matrix.target }}/release/fwknox \
            target/${{ matrix.target }}/release/fwknoxd

      - name: Install cargo-deb
        run: cargo install --locked cargo-deb

      # --no-build: we already have the binaries from the `build` job.
      # --no-strip: binaries may already be stripped by cargo's release
      # profile; in any case, strip is a no-op on already-stripped ELF.
      - name: Build .deb
        run: |
          cargo deb \
            -p fwknox-daemon \
            --target ${{ matrix.target }} \
            --no-build \
            --no-strip \
            --output fwknox_${{ github.ref_name }}_${{ matrix.arch }}.deb

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: fwknox_*.deb
          retention-days: 1

  rpm:
    name: package .rpm (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rpm_arch: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rpm_arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Read rust-toolchain.toml channel
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/ {print $2}' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.target }}

      - uses: actions/download-artifact@v4
        with:
          name: release-build-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release

      - name: Restore binary permissions
        run: |
          chmod 0755 \
            target/${{ matrix.target }}/release/fwknox \
            target/${{ matrix.target }}/release/fwknoxd

      - name: Install cargo-generate-rpm
        run: cargo install --locked cargo-generate-rpm

      - name: Build .rpm
        run: |
          cargo generate-rpm \
            -p crates/fwknox-daemon \
            --target ${{ matrix.target }} \
            --payload-compress zstd

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: target/${{ matrix.target }}/generate-rpm/*.rpm
          retention-days: 1

  release:
    name: create GitHub release
    runs-on: ubuntu-latest
    needs: [build, manifest, deb, rpm]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: tarball-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: deb-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: rpm-*
          merge-multiple: true

      # Fetch the GitHub-generated source tarball for this tag, compute
      # its sha256, and patch dist/PKGBUILD in-place so the AUR-facing
      # release asset carries a real digest instead of "SKIP". The
      # in-tree PKGBUILD is left unchanged on purpose — only the release
      # artifact is pinned.
      - name: Patch PKGBUILD with source tarball sha256
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          url="https://github.com/${{ github.repository }}/archive/refs/tags/${tag}.tar.gz"
          curl -sSL "$url" -o release.tar.gz
          sha=$(sha256sum release.tar.gz | awk '{print $1}')
          sed -i "s/^sha256sums=.*/sha256sums=('${sha}')/" dist/PKGBUILD
          grep ^sha256sums dist/PKGBUILD
          rm release.tar.gz

      # Notes auto-generated from .github/release.yml categories applied
      # to PR titles merged since the previous tag. Prerelease flag is
      # set when the tag contains a hyphen (e.g. v0.1.0-rc1).
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-assets/fwknox-*.tar.gz
            release-assets/fwknox_*.deb
            release-assets/*.rpm
            dist/PKGBUILD
