# SPDX-License-Identifier: AGPL-3.0-or-later

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: build release binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --workspace --bins

      - name: Stage and archive
        run: |
          mkdir -p dist
          cp target/release/fwknox  dist/fwknox
          cp target/release/fwknoxd dist/fwknoxd
          cp config/fwknoxd.toml.example dist/fwknoxd.toml.example
          tar czf fwknox-${{ github.ref_name }}-x86_64-linux-gnu.tar.gz -C dist .

      - name: Upload dist directory
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

      - name: Upload release tarball
        uses: actions/upload-artifact@v4
        with:
          name: release-tarball
          path: fwknox-*.tar.gz
          retention-days: 1

  docker:
    name: build and push release image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Fetch built binaries
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Restore binary permissions
        run: chmod 0755 dist/fwknox dist/fwknoxd

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action strips the leading "v" so v0.1.0 -> 0.1.0 and
      # emits major.minor + major rolling tags. :latest is only applied
      # on the default branch to avoid demoting a newer release if an
      # older-branch hotfix tag is pushed.
      - name: Compute metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: create GitHub release
    runs-on: ubuntu-latest
    needs: [build, docker]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch release tarball
        uses: actions/download-artifact@v4
        with:
          name: release-tarball

      # Notes auto-generated from .github/release.yml categories applied
      # to PR titles merged since the previous tag. Prerelease flag is
      # set when the tag contains a hyphen (e.g. v0.1.0-rc1).
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: fwknox-*.tar.gz
